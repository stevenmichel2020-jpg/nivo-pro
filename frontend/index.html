<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>NIVO PRO - Panel VIP</title>
  <style>
    body {
      background: #0d0d0d;
      color: white;
      font-family: Arial, sans-serif;
      padding: 40px;
    }
    .container {
      max-width: 600px;
      margin: auto;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 20px;
    }
    button {
      background: #4caf50;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }
    #respuesta {
      margin-top: 20px;
      padding: 20px;
      background: #1a1a1a;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>NIVO PRO — Panel VIP</h1>

    <textarea id="prompt" placeholder="Escribe tu mensaje para el agente IA..."></textarea>
    <button onclick="enviar()">Enviar</button>

    <div id="respuesta"></div>
  </div>

  <script>
    async function enviar() {
      const prompt = document.getElementById("prompt").value;

      const res = await fetch("http://localhost:3000/api/ai/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });

      const data = await res.json();
      document.getElementById("respuesta").innerText = data.respuesta;
    }
  </script>
</body>
</html>
